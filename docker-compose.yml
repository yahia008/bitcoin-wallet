# `docker compose up` runs the whole wallet on regtest: the Bitcoin node, the API server and
# the web wallet. Open http://localhost:3001, and fund a wallet with ./fund <address> [btc].
#
# Only the node, for the tests or for running the server/site yourself:
#   docker compose up -d bitcoind
#
# Everything listens on localhost only.

services:
  bitcoind:
    image: bitcoin/bitcoin:latest
    container_name: bitcoind-regtest
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=wallet
      - -rpcpassword=wallet
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -txindex=1
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    # Healthy once RPC answers (not while it's still loading blocks), so the API waits.
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=wallet", "-rpcpassword=wallet", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 60

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    command:
      - --network=regtest
      - --backend=core
      - --rpc-url=http://bitcoind:18443
      - --data-dir=/data
      - --listen=0.0.0.0:3000
      - --cors-origins=http://localhost:3001,http://127.0.0.1:3001
      # The web container's nginx proxies /api/* here and sets X-Real-IP to the visitor's IP,
      # so rate limits stay per visitor even through a tunnel like ngrok.
      - --trust-x-real-ip
    depends_on:
      bitcoind:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api-data:/data
    restart: unless-stopped

  # Opt-in: the same server on the public testnet4, syncing from mempool.space's Esplora.
  # Needs internet access; the regtest demo above works without it.
  #   docker compose --profile testnet4 up -d
  api-testnet4:
    profiles: [testnet4]
    build:
      context: .
      dockerfile: Dockerfile.server
    command:
      - --network=testnet4
      - --backend=esplora
      - --esplora-url=https://mempool.space/testnet4/api
      - --data-dir=/data
      - --listen=0.0.0.0:3000
      # Public Esplora rate-limits; don't re-sync on every request.
      - --sync-interval-secs=30
      - --cors-origins=http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - api-testnet4-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3001:80"

volumes:
  bitcoin-data:
  api-data:
  api-testnet4-data:
