services:
  bitcoind:
    image: bitcoin/bitcoin:latest
    container_name: bitcoind-regtest
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=wallet
      - -rpcpassword=wallet
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -txindex=1
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin

volumes:
  bitcoin-data:
