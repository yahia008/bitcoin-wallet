[package]
name = "bitcoin-wallet"
version = "0.1.0"
edition = "2024"
default-run = "bitcoin-wallet"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
bdk_bitcoind_rpc = "0.22.0"
bdk_wallet = { version = "3.2.0", features = ["rusqlite", "keys-bip39"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ureq = { version = "3.4.2", features = ["json"] }
