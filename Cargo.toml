[package]
name = "bitcoin-wallet"
version = "0.1.0"
edition = "2024"
default-run = "bitcoin-wallet"

[workspace]
members = [".", "wallet-core", "wallet-wasm"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
bdk_bitcoind_rpc = "0.22.0"
bdk_esplora = { version = "0.22", default-features = false, features = ["std", "blocking-https-rustls"] }
bdk_wallet = { version = "3.2.0", features = ["rusqlite", "keys-bip39"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "3.4.2", features = ["json"] }
wallet-core = { path = "wallet-core" }

# Size-optimised build for the browser (wallet-wasm via `npm run wasm`); the CLI and server
# keep the normal release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
