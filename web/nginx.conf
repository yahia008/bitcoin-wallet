# nginx for the docker compose web wallet: serves the static site and passes /api/* on to the
# API server, so the page and the API share one origin. One port (and one ngrok tunnel) then
# serves both, and the browser needs no CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind a tunnel such as ngrok, every request arrives from the tunnel's local end. The
    # tunnel appends the visitor's IP to X-Forwarded-For; take that last entry as the client.
    # Nothing but the host can reach this port (it's bound to 127.0.0.1), so trust any peer.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri $uri/ =404;
    }

    # /api/health -> http://api:3000/health (the trailing slashes strip the /api prefix).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        # The API rate-limits per visitor by this header (server --trust-x-real-ip).
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api-testnet4/health -> http://api-testnet4:3000/health: the testnet4 server, for the
    # network menu. It's opt-in (docker compose --profile testnet4 up), so its name is looked
    # up per request through Docker's DNS rather than at startup, where a missing service
    # would stop nginx from starting at all. While it's down, the page says it can't reach it.
    location /api-testnet4/ {
        resolver 127.0.0.11 valid=10s;
        set $testnet4 http://api-testnet4:3000;
        rewrite ^/api-testnet4/(.*)$ /$1 break;
        proxy_pass $testnet4;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
